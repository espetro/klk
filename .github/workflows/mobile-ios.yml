name: mobile-ios

# Unsigned iOS Simulator build of apps/pwa (Pinya) + Maestro smoke test.
# macOS minutes bill at 10× on a private repo — main pushes and manual
# dispatch only, never every PR. Design: docs/ci-mobile.md.

on:
  push:
    branches: [main, devin/ios-ci]
    paths:
      - "apps/pwa/**"
      - "packages/**"
      - "patches/**"
      - "apps/pwa/maestro/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  ONE_SKIP_EXPO_SDK_CHECK: "1"
  # brew Ruby / CocoaPods crash without a UTF-8 locale (Mac mini bring-up).
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  ios-sim:
    name: iOS simulator build + smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # go is only needed for the local klk-relay the smoke test boots.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/relay/go.mod
          cache-dependency-path: apps/relay/go.sum

      - run: corepack pnpm install --frozen-lockfile

      # apps/pwa/{android,ios} are gitignored — generated by `one prebuild`.
      - name: Prebuild native projects
        run: CI=1 corepack pnpm --filter @klk/pwa prebuild:native

      # ruby/setup-ruby must run AFTER prebuild — ios/ does not exist at
      # checkout; prebuild generates it (with a Gemfile for CocoaPods).
      # Guard for prebuild outputs that ship no Gemfile.
      - name: Ensure ios/Gemfile
        working-directory: apps/pwa/ios
        run: |
          if [ ! -f Gemfile ]; then
            printf "source 'https://rubygems.org'\ngem 'cocoapods'\n" > Gemfile
          fi

      - uses: ruby/setup-ruby@v1
        with:
          # explicit pin — generated ios/ has no .ruby-version file
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apps/pwa/ios

      - uses: actions/cache@v6
        with:
          path: |
            apps/pwa/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/pwa/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: pod install
        working-directory: apps/pwa/ios
        run: bundle exec pod install

      # No CONFIGURATION_BUILD_DIR/-derivedDataPath overrides: CocoaPods
      # bakes default DerivedData paths into RCTSwiftUI dependents' module
      # map flags, so redirecting products breaks RCTSwiftUIWrapper.
      - name: Build Pinya for iOS Simulator (unsigned)
        working-directory: apps/pwa/ios
        run: |
          xcodebuild build \
            -workspace Pinya.xcworkspace \
            -scheme Pinya \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -name "Pinya.app" -path "*Debug-iphonesimulator*" | head -1)
          test -n "$APP_PATH" || { echo "::error::Pinya.app not found in DerivedData"; exit 1; }
          cp -R "$APP_PATH" build/Pinya.app
          echo "Copied $APP_PATH -> build/Pinya.app"

      - uses: actions/upload-artifact@v7
        with:
          name: pinya-simulator-app
          path: apps/pwa/ios/build/Pinya.app
          retention-days: 14

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The Debug .app loads its JS bundle from Metro, and the app only
      # reaches bootState "ready" once it can talk to a relay — the native
      # default is ws://localhost:3334, and the iOS simulator shares the
      # host's network. Boot both before launching the app.
      - name: Start klk-relay + Metro
        run: |
          (cd apps/relay && go build -o bin/klk-relay ./cmd/klk-relay)
          DATA_DIR=/tmp/klk-ci-data nohup ./apps/relay/bin/klk-relay >/tmp/klk-relay.log 2>&1 &
          (cd apps/pwa && nohup corepack pnpm dev:native >/tmp/metro.log 2>&1 &)
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3334/healthz >/dev/null \
              && curl -sf http://localhost:8081/status >/dev/null; then
              echo "relay + metro up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::relay/metro did not come up"
          tail -50 /tmp/klk-relay.log /tmp/metro.log || true
          exit 1

      - name: Maestro smoke — launch + Discover renders
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro start-device --platform ios
          xcrun simctl install booted apps/pwa/ios/build/Pinya.app
          maestro test apps/pwa/maestro/smoke.yaml
