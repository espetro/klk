name: Build Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/events/android/**/*.gradle*', 'apps/events/android/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Assemble debug APK
        working-directory: apps/events/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/events/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
