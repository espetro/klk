name: Build iOS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/events/ios/Pods
          key: pods-${{ hashFiles('apps/events/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        working-directory: apps/events/ios
        run: pod install --repo-update

      - name: Build for simulator
        working-directory: apps/events/ios
        run: |
          xcodebuild \
            -workspace Klk.xcworkspace \
            -scheme Klk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild \
              -workspace Klk.xcworkspace \
              -scheme Klk \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
