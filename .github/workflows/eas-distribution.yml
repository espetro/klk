name: EAS Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build-ios:
    runs-on: ubuntu-latest
    if: github.event.inputs.platforms != 'android'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Setup EAS
        uses: expo/setup-expo-action@v2
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        working-directory: apps/events
        run: eas build --platform ios --wait
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Submit iOS to TestFlight
        if: success()
        working-directory: apps/events
        run: eas submit --platform ios --wait
        env:
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}

  build-android:
    runs-on: ubuntu-latest
    if: github.event.inputs.platforms != 'ios'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Setup EAS
        uses: expo/setup-expo-action@v2
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        working-directory: apps/events
        run: eas build --platform android --wait

      - name: Submit Android to Play Internal Testing
        if: success()
        working-directory: apps/events
        run: eas submit --platform android --wait
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

  report:
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const iosStatus = '${{ needs.build-ios.result }}';
            const androidStatus = '${{ needs.build-android.result }}';

            const statusEmoji = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';

            const body = [
              `## Build Results for ${tag}`,
              '',
              `| Platform | Status |`,
              `|----------|--------|`,
              `| iOS | ${statusEmoji(iosStatus)} ${iosStatus} |`,
              `| Android | ${statusEmoji(androidStatus)} ${androidStatus} |`,
              '',
              'Check the [EAS Dashboard](https://expo.dev) for submission details.',
            ].join('\n');

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body,
                draft: false,
                prerelease: tag.includes('beta') || tag.includes('alpha'),
              });
            } catch {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const existing = releases.data.find((r) => r.tag_name === tag);
              if (existing) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.id,
                  body,
                });
              }
            }
