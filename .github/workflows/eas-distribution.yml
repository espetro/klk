name: EAS Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Setup EAS
        uses: expo/setup-expo-action@v2
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine platforms
        id: platforms
        run: |
          if [ "${{ github.event.inputs.platforms }}" = "all" ] || [ -z "${{ github.event.inputs.platforms }}" ]; then
            echo "PLATFORMS=all" >> $GITHUB_OUTPUT
          else
            echo "PLATFORMS=${{ github.event.inputs.platforms }}" >> $GITHUB_OUTPUT
          fi

      - name: Build for production
        working-directory: apps/events
        run: |
          if [ "${{ steps.platforms.outputs.PLATFORMS }}" = "all" ]; then
            eas build --platform all --wait
          else
            eas build --platform ${{ steps.platforms.outputs.PLATFORMS }} --wait
          fi

      - name: Submit to stores
        working-directory: apps/events
        if: success()
        run: |
          if [ "${{ steps.platforms.outputs.PLATFORMS }}" = "all" ]; then
            eas submit --platform all --wait
          else
            eas submit --platform ${{ steps.platforms.outputs.PLATFORMS }} --wait
          fi

      - name: Comment on release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = `✅ Build and submission for ${tag} completed.\n\n**Build Info:**\n- Platforms: ${{ steps.platforms.outputs.PLATFORMS }}\n- Status: Success\n\nCheck EAS Dashboard for submission status.`;

            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              body: body,
              draft: false,
              prerelease: false
            }).catch(() => {
              // Release already exists, update it
              github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: body
              });
            });
