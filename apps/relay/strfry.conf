##
## strfry configuration — Klk relay
## Docs: https://github.com/hoytech/strfry
##

db = "./strfry-db"

dbParams {
    # Hard disk ceiling — ~4 GB for ~3 months of data at expected volume
    mapsize = 4294967296  # 4 GB in bytes
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    # Reject payloads larger than 128 KB
    maxWebsocketPayloadSize = 131072

    # Per-connection subscription limit
    maxSubsPerConnection = 20

    # Maximum events returned per filter
    maxFilterLimit = 500

    compression = true

    writePolicy {
        plugin = "/write-policy/write-policy.js"
    }

    # Reject events dated more than 10 minutes in the future
    rejectEventsNewerThanSeconds = 600

    # Reject events larger than 64 KB
    maxEventSize = 65536
}

events {
    # Auto-delete events older than 90 days (7776000 seconds)
    retention = [
        { "timeLimit": 7776000 }
    ]
}
