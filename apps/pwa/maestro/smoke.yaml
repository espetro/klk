# Minimal launch smoke: guest boot → Discover screen.
# "Upcoming" is the drawer's header — it only renders once boot reaches
# bootState "ready" (guest connect to the local relay), so this asserts
# real first-screen content, not just the shell/tab bar.
# Requires: app installed on a booted sim, Metro on :8081, relay on :3334.
appId: club.pinya.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Upcoming"
    timeout: 180000
- assertVisible: "Upcoming"
